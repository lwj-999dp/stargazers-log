<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred software repositories.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Stargazers log</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Open source notebook</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small, searchable record of the repositories I have starred.</p>
      </header>

      <section class="repository-section" aria-labelledby="repository-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Repository index</p>
            <h2 id="repository-heading">Starred repositories</h2>
          </div>
          <span class="repository-count" id="repository-count">Loading...</span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status-message">Loading repositories...</p>
        </div>
      </section>
    </main>
  </body>
</html>
